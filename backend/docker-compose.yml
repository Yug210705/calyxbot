version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: calyx
      POSTGRES_PASSWORD: calyxpassword
      POSTGRES_DB: calyx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calyx -d calyx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
